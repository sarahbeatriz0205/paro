<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Em Jogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #2a1b54;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 28px 28px;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 960px;
            background-color: #3f2f82;
            border: 2px solid #5743a3;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Top Header Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mini-logo {
            width: 44px;
            height: 44px;
            background-color: #e5122b;
            border: 3px solid #fff;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 0.75rem;
            transform: rotate(-10deg);
            color: #fff;
        }

        .brand-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.6rem;
            color: #ffeb3b;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-badge {
            background-color: #312170;
            border: 2px solid #5743a3;
            padding: 10px 18px;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background-color: transparent;
            border: 2px solid #5743a3;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background-color: #4f3b99;
            border-color: #795dcd;
        }

        /* Game Header Section */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .round-info {
            font-size: 0.85rem;
            font-weight: 700;
            color: #9a88cd;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .game-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: #ffeb3b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .game-status-widgets {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .timer-badge {
            background-color: #312170;
            border: 2px solid #5743a3;
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #00f0b5;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
        }

        .letter-card {
            background-color: #231754;
            border: 3px solid #ffeb3b;
            border-radius: 14px;
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            color: #00f0b5;
        }

        /* Main Game Layout */
        .game-body {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        /* Leaderboard / Placar */
        .placar-card {
            background-color: #312170;
            border: 2px solid #5743a3;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .placar-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.15rem;
            color: #00f0b5;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .player-score-item {
            background-color: #3f2f82;
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .player-rank-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rank-number {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 0.9rem;
            color: #1c103f;
            flex-shrink: 0;
        }

        .rank-number.cyan { background-color: #00f0b5; }
        .rank-number.yellow { background-color: #ffeb3b; }
        .rank-number.red { background-color: #e5122b; color: #fff; }

        .player-score-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
        }

        .player-score-value {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            color: #ffeb3b;
        }

        /* Categories Grid */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .category-card {
            background-color: #312170;
            border: 2px solid #5743a3;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .category-label {
            font-size: 0.75rem;
            font-weight: 800;
            color: #00f0b5;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            text-align: center;
        }

        .category-input {
            width: 100%;
            background-color: #fefce8;
            border: none;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            color: #444;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            transition: ring 0.2s;
        }

        .category-input::placeholder {
            color: #a39e8c;
            font-weight: 600;
        }

        .category-input:focus {
            box-shadow: 0 0 0 3px #00f0b5;
        }

        /* Bottom Controls & Timer Bar */
        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #231754;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 85%;
            height: 100%;
            background-color: #e5122b;
            border-radius: 6px;
        }

        .btn-paro {
            background-color: #ffeb3b;
            color: #1c103f;
            border: none;
            border-radius: 14px;
            padding: 14px 60px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.1s, filter 0.2s;
        }

        .btn-paro:hover {
            filter: brightness(1.08);
        }

        .btn-paro:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #a30b1c;
        }

        /* Responsividade */
        @media (max-width: 820px) {
            .game-body {
                grid-template-columns: 1fr;
            }

            .categories-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .categories-grid {
                grid-template-columns: 1fr;
            }

            .brand-title {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header Bar -->
        <!-- Game Header -->
        <div class="game-header">
            <div>
                <div class="round-info">RODADA 2 DE 5</div>
                <h1 class="game-title">PREENCHA AS CATEGORIAS</h1>
            </div>
            <div class="game-status-widgets">
                <div class="timer-badge">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" stroke-linecap="round" stroke-linejoin="round"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 7v5l3 3"/>
                    </svg>
                    00:66
                </div>
                <div class="letter-card">V</div>
            </div>
        </div>

        <!-- Main Game Body -->
        <div class="game-body">
            <!-- Placar / Leaderboard -->
            <div class="placar-card">
                <span class="placar-title">PLACAR</span>
                
                <div class="player-score-item">
                    <div class="player-rank-info">
                        <span class="rank-number cyan">1</span>
                        <span class="player-score-name">Bia</span>
                    </div>
                    <span class="player-score-value">240</span>
                </div>

                <div class="player-score-item">
                    <div class="player-rank-info">
                        <span class="rank-number yellow">2</span>
                        <span class="player-score-name">Rafa</span>
                    </div>
                    <span class="player-score-value">205</span>
                </div>

                <div class="player-score-item">
                    <div class="player-rank-info">
                        <span class="rank-number red">3</span>
                        <span class="player-score-name">Nando</span>
                    </div>
                    <span class="player-score-value">180</span>
                </div>

                <div class="player-score-item">
                    <div class="player-rank-info">
                        <span class="rank-number cyan">4</span>
                        <span class="player-score-name">Lia</span>
                    </div>
                    <span class="player-score-value">150</span>
                </div>
            </div>

            <!-- Categories Inputs Grid -->
            <div class="categories-grid">
                <!-- 1. Nome -->
                <div class="category-card">
                    <span class="category-label">NOME</span>
                    <input type="text" class="category-input" placeholder="Digite aqui">
                </div>

                <!-- 2. Animal -->
                <div class="category-card">
                    <span class="category-label">ANIMAL</span>
                    <input type="text" class="category-input" placeholder="Digite aqui">
                </div>

                <!-- 3. Comida -->
                <div class="category-card">
                    <span class="category-label">FRUTA</span>
                    <input type="text" class="category-input" placeholder="Digite aqui">
                </div>

                <!-- 4. Cidade -->
                <div class="category-card">
                    <span class="category-label">COR</span>
                    <input type="text" class="category-input" placeholder="Digite aqui">
                </div>

                <!-- 5. Marca -->
                <div class="category-card">
                    <span class="category-label">COMIDA</span>
                    <input type="text" class="category-input" placeholder="Digite aqui">
                </div>

                <!-- 6. Objeto -->
                <div class="category-card">
                    <span class="category-label">OBJETO</span>
                    <input type="text" class="category-input" placeholder="Digite aqui">
                </div>                
            </div>
        </div>

        <!-- Bottom Controls -->
        <div class="bottom-section">
            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>
            <button class="btn-paro">ENVIAR RESPOSTAS</button>
        </div>
    </div>

</body>
</html>
