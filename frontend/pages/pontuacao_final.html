<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado da Rodada - Adedonha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #2a1b54;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 28px 28px;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 960px;
            background-color: #3f2f82;
            border: 2px solid #5743a3;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Top Header Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mini-logo {
            width: 44px;
            height: 44px;
            background-color: #e5122b;
            border: 3px solid #fff;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 0.75rem;
            transform: rotate(-10deg);
            color: #fff;
        }

        .brand-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.6rem;
            color: #ffeb3b;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-badge {
            background-color: #312170;
            border: 2px solid #5743a3;
            padding: 10px 18px;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background-color: transparent;
            border: 2px solid #5743a3;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background-color: #4f3b99;
            border-color: #795dcd;
        }

        /* Result Header */
        .result-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .trophy-icon {
            color: #ffeb3b;
            margin-bottom: 6px;
            display: inline-block;
        }

        .round-status {
            font-size: 0.85rem;
            font-weight: 800;
            color: #00f0b5;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .page-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 2.3rem;
            color: #ffeb3b;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        /* Results Table Card */
        .table-card {
            background-color: rgba(49, 33, 112, 0.6);
            border: 2px solid #5743a3;
            border-radius: 16px;
            padding: 12px 20px;
            max-width: 760px;
            margin: 0 auto 28px auto;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .results-table th {
            font-size: 0.75rem;
            font-weight: 800;
            color: #bfaee3;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .results-table th:last-child,
        .results-table td:last-child {
            text-align: right;
        }

        .results-table td {
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .results-table tr:last-child td {
            border-bottom: none;
        }

        .results-table .player-name {
            font-weight: 700;
            color: #ffffff;
            font-size: 1.05rem;
        }

        .results-table .points-value {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            color: #ffeb3b;
        }

        /* Action Buttons */
        .actions-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
        }

.bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .btn-sair {
            background-color: #312170;
            border: 2px solid #5743a3;
            color: #fff;
            border-radius: 12px;
            padding: 12px 24px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-sair:hover {
            background-color: #4f3b99;
            border-color: #795dcd;
        }

.btn-paro {
            background-color: #e5122b;
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 14px 60px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.5rem;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #a30b1c;
            transition: transform 0.1s, filter 0.2s;
        }

        .btn-placar {
            background-color: #ffeb3b;
            color: #1c103f;
            border: none;
            border-radius: 12px;
            padding: 12px 26px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.05rem;
            letter-spacing: 0.8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #c2b11e;
            transition: transform 0.1s, filter 0.2s;
        }

        .btn-placar:hover {
            filter: brightness(1.05);
        }

        .btn-placar:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c2b11e;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            .app-container {
                padding: 18px;
            }

            .brand-title {
                display: none;
            }

            .page-title {
                font-size: 1.7rem;
            }

            .results-table th, .results-table td {
                padding: 10px 8px;
                font-size: 0.85rem;
            }

            .actions-footer {
                flex-direction: column;
                width: 100%;
            }

            .btn-sair, .btn-placar {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">


        <!-- Result Header -->
        <div class="result-header">
            <div class="trophy-icon">
                <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15c-3.314 0-6-2.686-6-6V3h12v6c0 3.314-2.686 6-6 6z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 5H3a2 2 0 00-2 2v1a4 4 0 004 4h1"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M18 5h3a2 2 0 012 2v1a4 4 0 01-4 4h-1"/>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v4m-4 0h8"/>
                </svg>
            </div>
            <div class="round-status">PARTIDA ENCERRADA</div>
            <h1 class="page-title">PONTUAÇÃO FINAL DO JOGO</h1>
        </div>

        <!-- Participants & Scores Table Card -->
        <div class="table-card">
            <table class="results-table">
                <thead>
                    <tr>
                        <th>PARTICIPANTE</th>
                        <th>PONTUAÇÃO TOTAL</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="player-name">Bia</td>
                        <td class="points-value">240 Pts</td>
                    </tr>
                    <tr>
                        <td class="player-name">Rafa</td>
                        <td class="points-value">205 Pts</td>
                    </tr>
                    <tr>
                        <td class="player-name">Nando</td>
                        <td class="points-value">180 Pts</td>
                    </tr>
                    <tr>
                        <td class="player-name">Lia</td>
                        <td class="points-value">150 Pts</td>
                    </tr>
                </tbody>
            </table>
        </div>
<!-- Bottom Controls -->
        <div class="bottom-section">
            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>
            <button class="btn-paro">SAIR</button>
        </div>

</body>
</html>
