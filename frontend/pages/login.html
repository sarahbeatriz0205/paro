<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #2a1b54;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 28px 28px;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 960px;
            background-color: #3f2f82;
            border: 2px solid #5743a3;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Top Header Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mini-logo {
            width: 44px;
            height: 44px;
            background-color: #e5122b;
            border: 3px solid #fff;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 0.75rem;
            transform: rotate(-10deg);
            color: #fff;
        }

        .brand-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.6rem;
            color: #ffeb3b;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-badge {
            background-color: #312170;
            border: 2px solid #5743a3;
            padding: 10px 18px;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background-color: transparent;
            border: 2px solid #5743a3;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

            .icon-btn:hover {
                background-color: #4f3b99;
                border-color: #795dcd;
            }

        /* Page Header */
        .page-header {
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: 520px;
            margin: 0 auto 24px auto;
        }

        .btn-back {
            background-color: #312170;
            border: 2px solid #5743a3;
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

            .btn-back:hover {
                background-color: #4f3b99;
                border-color: #795dcd;
            }

        .title-text h1 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 2.1rem;
            color: #ffeb3b;
            letter-spacing: 1px;
            line-height: 1;
            text-transform: uppercase;
        }

        .title-text p {
            color: #bfaee3;
            font-size: 0.95rem;
            margin-top: 6px;
            font-weight: 600;
        }

        /* Form Card Container */
        .form-card {
            background-color: rgba(49, 33, 112, 0.6);
            border: 2px solid #5743a3;
            border-radius: 20px;
            padding: 32px 28px;
            max-width: 520px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

            .form-group label {
                display: block;
                font-size: 0.75rem;
                font-weight: 800;
                color: #bfaee3;
                letter-spacing: 0.8px;
                text-transform: uppercase;
                margin-bottom: 8px;
            }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: #281a54;
            border: 2px solid #5743a3;
            border-radius: 14px;
            padding: 12px 16px;
            transition: border-color 0.2s;
        }

            .input-wrapper:focus-within {
                border-color: #795dcd;
            }

            .input-wrapper svg {
                flex-shrink: 0;
            }

            .input-wrapper input {
                background: transparent;
                border: none;
                outline: none;
                color: #fff;
                font-size: 0.95rem;
                font-weight: 600;
                width: 100%;
            }

                .input-wrapper input::placeholder {
                    color: rgba(255, 255, 255, 0.45);
                    font-weight: 500;
                }

        .icon-user {
            color: #ffeb3b;
        }

        .icon-lock {
            color: #00f0b5;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background-color: #ffeb3b;
            color: #1c103f;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.15rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 0 #c2b11e;
            margin-top: 10px;
            margin-bottom: 20px;
            transition: transform 0.1s, filter 0.2s;
        }

            .btn-submit:hover {
                filter: brightness(1.05);
            }

            .btn-submit:active {
                transform: translateY(2px);
                box-shadow: 0 2px 0 #c2b11e;
            }

        /* Form Footer Link */
        .form-footer {
            text-align: center;
            font-size: 0.95rem;
            color: #bfaee3;
            font-weight: 600;
        }

            .form-footer a {
                color: #00f0b5;
                text-decoration: underline;
                font-weight: 800;
                cursor: pointer;
            }

                .form-footer a:hover {
                    color: #33f4c4;
                }

        /* Responsividade */
        @media (max-width: 600px) {
            .app-container {
                padding: 18px;
            }

            .brand-title {
                display: none;
            }

            .page-header {
                gap: 12px;
            }

            .title-text h1 {
                font-size: 1.7rem;
            }

            .form-card {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Header Bar -->
 

        <!-- Page Header -->
        <div class="page-header">
            <button class="btn-back" title="Voltar">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
            </button>
            <div class="title-text">
                <h1>ENTRAR</h1>
                <p>Entre na sua conta para criar a sala.</p>
            </div>
        </div>

        <!-- Form Card Container -->
        <div class="form-card">
            <form onsubmit="event.preventDefault();">
                <!-- Apelido -->
                <div class="form-group">
                    <label for="nickname">APELIDO</label>
                    <div class="input-wrapper">
                        <svg class="icon-user" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        <input type="text" id="nickname" placeholder="Seu apelido" required>
                    </div>
                </div>

                <!-- Senha -->
                <div class="form-group">
                    <label for="password">SENHA</label>
                    <div class="input-wrapper">
                        <svg class="icon-lock" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        <input type="password" id="password" placeholder="Sua senha" required>
                    </div>
                </div>

                <!-- Botão Entrar -->
                <button type="submit" class="btn-submit" id="btnFazerLogin">
                    <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                    </svg>
                    ENTRAR
                </button>

                <!-- Link de Registro -->
                <div class="form-footer">
                    Ainda não tem conta? <a href="criar_conta.html">Criar conta</a>
                </div>
            </form>
        </div>
    </div>
<script src="../scripts/login.js"></script>
</body>
</html>
