<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paro-24</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #2a1b54;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 28px 28px;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 960px;
            background-color: #3f2f82;
            border: 2px solid #5743a3;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Top Header Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mini-logo {
            width: 44px;
            height: 44px;
            background-color: #e5122b;
            border: 3px solid #fff;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 0.75rem;
            transform: rotate(-10deg);
            color: #fff;
        }

        .brand-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.6rem;
            color: #ffeb3b;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-badge {
            background-color: #312170;
            border: 2px solid #5743a3;
            padding: 10px 18px;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background-color: transparent;
            border: 2px solid #5743a3;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background-color: #4f3b99;
            border-color: #795dcd;
        }

        /* Page Header Title Section */
        .page-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 25px;
            max-width: 860px;
            margin-left: auto;
            margin-right: auto;
        }

        .back-btn {
            background-color: transparent;
            border: 2px solid #5743a3;
            color: #fff;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background-color: #4f3b99;
        }

        .page-title-group h1 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: #ffeb3b;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        .page-title-group p {
            color: #bfaee3;
            font-size: 0.98rem;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Main Lobby Layout */
        .lobby-container {
            max-width: 860px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            align-items: start;
        }

        /* Players Section */
        .players-card {
            background-color: #312170;
            border: 2px solid #5743a3;
            border-radius: 18px;
            padding: 24px;
        }

        .players-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .players-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.25rem;
            color: #00f0b5;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .players-count {
            color: #bfaee3;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .player-item {
            background-color: #3f2f82;
            border: 2px solid #5743a3;
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.05rem;
            color: #1c103f;
            flex-shrink: 0;
        }

        .avatar-circle.cyan { background-color: #00f0b5; }
        .avatar-circle.yellow { background-color: #ffeb3b; }
        .avatar-circle.red { background-color: #e5122b; color: #fff; }

        .player-name {
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
        }

        .crown-icon {
            color: #ffeb3b;
            display: flex;
            align-items: center;
        }

        /* Room Info & Controls Section */
        .room-controls-card {
            background-color: #312170;
            border: 2px solid #5743a3;
            border-radius: 18px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .code-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #9a88cd;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .room-code {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 2.2rem;
            color: #ffeb3b;
            letter-spacing: 1px;
            margin-bottom: 16px;
            line-height: 1;
        }

        .btn-copy {
            width: 100%;
            background-color: #3f2f82;
            border: 2px solid #5743a3;
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            transition: all 0.2s;
            margin-bottom: 24px;
        }

        .btn-copy:hover {
            background-color: #4f3b99;
            border-color: #795dcd;
        }

        .share-hint {
            color: #bfaee3;
            font-size: 0.88rem;
            font-weight: 600;
            line-height: 1.35;
            margin-bottom: 24px;
            max-width: 200px;
        }

        .btn-start {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background-color: #ffeb3b;
            color: #1c103f;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 0.8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #c2b11e;
            transition: transform 0.1s, filter 0.2s;
        }

        .btn-start:hover {
            filter: brightness(1.05);
        }

        .btn-start:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #c2b11e;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .lobby-container {
                grid-template-columns: 1fr;
            }

            .players-grid {
                grid-template-columns: 1fr;
            }

            .brand-title {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Header Bar -->
       

        <!-- Main Lobby Grid -->
        <div class="lobby-container">
            <!-- Left: Players Card -->
            <div class="players-card">
                <div class="players-header">
                    <span class="players-title">JOGADORES</span>
                </div>
                <div class="players-grid">
                    
                </div>
            </div>

            <!-- Right: Room Code & Action Card -->
<div class="room-controls-card">
    <span class="code-label">CÓDIGO DA SALA</span>
    <div class="room-code" id="codigoSala"></div>

    <p class="share-hint">Compartilhe o código com seus amigos.</p>

    <button class="btn-start" id="btnIniciar" style="display:none;">
        INICIAR RODADA
    </button>
</div>              </div>
        </div>
    </div>
<script src="../scripts/menu_sala.js"></script>
</body>
</html>
