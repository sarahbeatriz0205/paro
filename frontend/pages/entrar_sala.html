<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar em uma sala</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #2a1b54;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 28px 28px;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 960px;
            background-color: #3f2f82;
            border: 2px solid #5743a3;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* Top Header Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mini-logo {
            width: 44px;
            height: 44px;
            background-color: #e5122b;
            border: 3px solid #fff;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 0.75rem;
            transform: rotate(-10deg);
            color: #fff;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.3);
        }

        .brand-title {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.6rem;
            color: #ffeb3b;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-badge {
            background-color: #312170;
            border: 2px solid #5743a3;
            padding: 10px 18px;
            border-radius: 12px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .icon-btn {
            background-color: transparent;
            border: 2px solid #5743a3;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background-color: #4f3b99;
            border-color: #795dcd;
        }

        /* Page Header Title Section */
        .page-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 25px;
            max-width: 820px;
            margin-left: auto;
            margin-right: auto;
        }

        .back-btn {
            background-color: transparent;
            border: 2px solid #5743a3;
            color: #fff;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .back-btn:hover {
            background-color: #4f3b99;
        }

        .page-title-group h1 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: #ffeb3b;
            text-transform: uppercase;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        .page-title-group p {
            color: #bfaee3;
            font-size: 0.98rem;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Content Wrapper */
        .content-container {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Search Input Bar */
        .search-box {
            position: relative;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #00f0b5;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background-color: #312170;
            border: 2px solid #5743a3;
            border-radius: 14px;
            padding: 16px 20px 16px 52px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input::placeholder {
            color: #8f7fbf;
            font-weight: 600;
        }

        .search-input:focus {
            border-color: #00f0b5;
        }

        /* Room Cards List */
        .rooms-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .room-card {
            background-color: #312170;
            border: 2px solid #5743a3;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: border-color 0.2s;
        }

        .room-card:hover {
            border-color: #795dcd;
        }

        .room-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar-box {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Card Icon Colors */
        .avatar-box.cyan {
            background-color: #00f0b5;
        }

        .avatar-box.yellow {
            background-color: #ffeb3b;
        }

        .avatar-box.red {
            background-color: #e5122b;
        }

        .avatar-box svg {
            color: #1c103f;
        }

        .room-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .room-name {
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.25rem;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .room-meta {
            color: #bfaee3;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Entrar Button */
        .btn-entrar {
            background-color: #ffeb3b;
            color: #1c103f;
            border: none;
            border-radius: 12px;
            padding: 12px 28px;
            font-family: 'Fredoka', sans-serif;
            font-weight: 900;
            font-size: 1.05rem;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 0 #c2b11e;
            transition: transform 0.1s, filter 0.2s;
            flex-shrink: 0;
        }

        .btn-entrar:hover {
            filter: brightness(1.05);
        }

        .btn-entrar:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c2b11e;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            .app-container {
                padding: 18px;
            }

            .brand-title {
                display: none;
            }

            .room-name {
                font-size: 1.05rem;
            }

            .btn-entrar {
                padding: 10px 18px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Page Header -->
        <div class="page-header">
            <button class="back-btn" title="Voltar">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
                </svg>
            </button>
            <div class="page-title-group">
                <h1>ENTRAR EM UMA SALA</h1>
                <p>Entre em uma sala pelo código</p>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="content-container">
            <!-- Search Bar -->
            <div class="search-box">
                <div class="search-icon">
                    <svg width="22" height="22" fill="none" stroke="#00f0b5" stroke-width="2.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                <input type="text" class="search-input" id="codigoSala" placeholder="Insira o código">
            </div>

                                    <button class="btn-entrar" id="btnEntrar">ENTRAR</button>
                </div>
            </div>
        </div>
    </div>
<script src="../scripts/entrar_sala.js"></script>
</body>
</html>
